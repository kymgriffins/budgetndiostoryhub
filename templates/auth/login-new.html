<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Budget Ndio Story</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #141414;
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #262626;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .auth-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .auth-header p {
            color: #737373;
            font-size: 15px;
        }
        
        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            background: #1a1a1a;
            padding: 4px;
            border-radius: 8px;
        }
        
        .auth-tab {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: #737373;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .auth-tab.active {
            background: #fff;
            color: #000;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #d4d4d4;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #fff;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-primary:hover {
            background: #e5e5e5;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #737373;
            font-size: 13px;
        }
        
        .home-link {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .home-link a {
            color: #737373;
            text-decoration: none;
            font-size: 14px;
        }
        
        .home-link a:hover {
            color: #fff;
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }
        
        .errorlist {
            color: #dc2626;
            font-size: 13px;
            list-style: none;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>
        
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Sign in to access your dashboard</p>
        </div>
        
        {% if form.errors %}
        <div class="error-message">
            Please correct the errors below and try again.
        </div>
        {% endif %}
        
        <div class="auth-tabs">
            <button class="auth-tab active" type="button" onclick="showTab('login')">Sign In</button>
            <button class="auth-tab" type="button" onclick="showTab('signup')">Sign Up</button>
        </div>
        
        <!-- Login Form -->
        <form method="post" action="{% url 'login_page' %}" class="auth-form active" id="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>
        
        <!-- Signup Form -->
        <form method="post" action="{% url 'register' %}" class="auth-form" id="signup-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_reg_username">Username</label>
                <input type="text" name="username" id="id_reg_username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="id_reg_password1">Password</label>
                <input type="password" name="password1" id="id_reg_password1" required placeholder="Choose a password">
            </div>
            <div class="form-group">
                <label for="id_reg_password2">Confirm Password</label>
                <input type="password" name="password2" id="id_reg_password2" required placeholder="Confirm your password">
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>
        
        <div class="auth-footer">
            <p>By continuing, you agree to our Terms of Service and Privacy Policy.</p>
        </div>
    </div>

    <script>
        function showTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }
    </script>
</body>
</html>
