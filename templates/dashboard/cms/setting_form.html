{% extends 'admin_base.html' %}
{% load static %}
{% block title %}{% if object %}Edit Setting{% else %}Create Setting{% endblock %}
{% block content %}
<div class="mb-8"><h1 class="text-3xl font-bold tracking-tight">{% if object %}Edit{% else %}Create{% endif %} Setting</h1></div>
<form method="post" class="space-y-6 max-w-2xl">
    {% csrf_token %}
    <div class="rounded-xl border bg-card p-6"><div class="space-y-4">{{ form.as_p }}</div></div>
    <div class="flex items-center gap-4">
        <button type="submit" class="inline-flex items-center justify-center rounded-lg bg-primary px-6 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90">Save</button>
        <a href="{% url 'setting-list' %}" class="inline-flex items-center justify-center rounded-lg border bg-background px-6 py-2 text-sm font-medium hover:bg-accent">Cancel</a>
    </div>
</form>
{% endblock %}
